[package]
name = "jarvis"
version = "1.0.0"
description = "J.A.R.V.I.S. native shell (Windows and Android) built with Tauri 2"
edition = "2021"
rust-version = "1.77"
license = "UNLICENSED"
publish = false

[lib]
name = "jarvis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
