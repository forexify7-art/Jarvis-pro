name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: JARVIS-IronMan

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: JARVIS-IronMan/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm ci

      - name: Run Python tests
        run: python -m unittest discover -s test -p '*_test.py' -v

      - name: Run dependency audit
        run: npm audit --audit-level=moderate

      - name: Build and check JavaScript
        run: npm run check

      - name: Run Node tests
        run: npm test

      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run browser end-to-end tests
        run: npm run test:browser

      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: JARVIS-IronMan/test-results/
          if-no-files-found: ignore
          retention-days: 7

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: JARVIS-IronMan/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run desktop:dist

      - name: Upload unsigned Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-windows-installer
          path: JARVIS-IronMan/dist-desktop/*.exe
          if-no-files-found: error
          retention-days: 7
