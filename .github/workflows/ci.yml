name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm ci

      - name: Run Python tests
        run: python -m unittest discover -s test -p '*_test.py' -v

      - name: Run dependency audit
        run: npm audit --audit-level=moderate

      - name: Build and check JavaScript
        run: npm run check

      - name: Run Node tests
        run: npm test

      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run browser end-to-end tests
        run: npm run test:browser

      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run desktop:dist

      - name: Verify Windows installer
        shell: pwsh
        run: |
          $installer = Get-Item -LiteralPath 'dist-desktop/JARVIS-Setup-x64.exe' -ErrorAction Stop
          if ($installer.Length -lt 1MB) {
            throw "Installer is unexpectedly small: $($installer.Length) bytes"
          }
          Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256

      - name: Upload unsigned Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Setup-x64.exe
          path: dist-desktop/JARVIS-Setup-x64.exe
          if-no-files-found: error
          retention-days: 7