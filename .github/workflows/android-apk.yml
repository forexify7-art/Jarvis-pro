name: Android debug APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_NDK_VERSION: 27.0.12077973
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;${ANDROID_NDK_VERSION}"

      - name: Set up Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set Android NDK environment
        run: echo "NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install Node dependencies
        run: npm ci

      - name: Initialize Tauri Android project and permissions
        run: npm run tauri:android:init

      - name: Build ARM64 debug APK
        run: npm run tauri:android:build:debug

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          apk_path="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          if [[ -z "$apk_path" ]]; then
            echo "Tauri did not produce an APK."
            exit 1
          fi
          unzip -t "$apk_path" >/dev/null
          if ! unzip -Z1 "$apk_path" | grep -Eq '^lib/arm64-v8a/[^/]+\.so$'; then
            echo "APK does not contain an arm64-v8a native library: $apk_path"
            unzip -Z1 "$apk_path" | grep '^lib/' || true
            exit 1
          fi
          mkdir -p artifacts
          cp "$apk_path" artifacts/JARVIS-android-arm64-debug.apk
          sha256sum artifacts/JARVIS-android-arm64-debug.apk | tee artifacts/JARVIS-android-arm64-debug.apk.sha256

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-arm64-debug
          path: artifacts/JARVIS-android-arm64-debug.apk*
          if-no-files-found: error
          retention-days: 14
