services:
  - type: web
    name: jarvis-by-khan-production
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build:avatar
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-3.8-flash
      - key: APP_ACCESS_TOKEN
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
